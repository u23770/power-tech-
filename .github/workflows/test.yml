name: Tests
on:
  push:
    branches: [main, feat/admin-code-and-demo-catalog]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Syntax-check JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          for dir in admin customer shared api; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -name '*.js' -print0
            fi
          done | xargs -0 -r -n1 node --check
